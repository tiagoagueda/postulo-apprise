[project]
name = "postulo-apprise"
version = "0.3.0"
description = "Notifications from Postulo through Apprise: Telegram, ntfy, Discord, Matrix, Gotify, Pushover, Signal, email and well over a hundred other services, each named by one URL."
readme = "README.md"
requires-python = ">=3.12.4"
license = "AGPL-3.0-or-later"
authors = [{ name = "Tiago Agueda" }]
keywords = ["postulo", "plugin", "apprise", "notifications"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Communications",
]
# Apprise is the whole point. Postulo itself is not declared: a plugin runs inside
# Postulo's environment and uses what is already there, and Postulo is not on PyPI, so
# naming it here would send pip looking for something it cannot find.
dependencies = ["apprise>=1.9"]

[project.urls]
Homepage = "https://source.tiagoagueda.com/postulo/postulo-apprise"
"Postulo" = "https://source.tiagoagueda.com/postulo/postulo"
"Apprise" = "https://github.com/caronc/apprise"
"Writing a plugin" = "https://source.tiagoagueda.com/postulo/postulo/src/branch/main/docs/PLUGINS.md"

# The installation, in full: Postulo reads this group when it starts and the notifier
# appears under Settings → Connections.
[project.entry-points."postulo.notifiers"]
apprise = "postulo_apprise.notifier:AppriseNotifier"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/postulo_apprise"]
# The compiled catalogues: not committed (a translation arriving from Weblate would
# leave a stale one behind), so `postulo-messages compile` writes them before the build
# and this puts them in the wheel, which leaves out what .gitignore names.
artifacts = ["src/postulo_apprise/locale/*/LC_MESSAGES/django.mo"]

[dependency-groups]
# Postulo itself, for the tests: they run the plugin inside a real Postulo, through its
# registry, exactly as an instance would.
#
# Pinned to a commit rather than left at the default branch. Without a ref the tests ran
# against whatever Postulo was on that morning, which is how a plugin released beside 0.3.0
# came to be tested against something else and how the catalogue tests came to skip in
# silence (#1). This is the 0.3.0 release line; there is no `v0.3.0` tag yet, and the day
# there is one, `@v0.3.0` replaces the commit and says the same thing in words.
dev = [
    "postulo @ git+https://source.tiagoagueda.com/postulo/postulo.git@925e3e9cd35a97617cc45b36ecdde862d04515b1",
    "pytest>=8.3",
    "pytest-django>=4.14",
    "ruff>=0.16",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error"]
# The release gate: the twenty-four European Union catalogues complete, run before a tag
# with `uv run pytest -m release`. Postulo's own gate cannot see a plugin's catalogues,
# so each plugin holds its own (postulo/postulo#187).
addopts = "--strict-markers -m 'not release'"
markers = [
    "release: a promise that must hold in a published version, not in every commit",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
