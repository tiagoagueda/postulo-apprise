# The tests on the Pythons a push does not test (#13).
#
# `ci.yml` runs them on the newest supported Python alone, on every push. A plugin is
# installed into whichever Python the instance runs, and `requires-python` promises 3.12 and
# 3.13 as well, so they run here instead: weekly, on every release branch, and whenever
# somebody starts it by hand before a tag. The core does the same (postulo/postulo#713).
#
# A workflow of its own rather than a matrix in `ci.yml`, for the reasons the core's
# `every-python.yml` gives: this Forgejo expands a matrix before it knows the event.
#
# Each leg is the shared plugin CI, Postulo/plugin-ci (postulo/postulo#1170), on that Python;
# `ci.yml` says why it is named by its full address.
name: Every Python

on:
  push:
    # Release branches only; `main` is `ci.yml`'s alone.
    branches: ["[0-9]*"]
  schedule:
    # The same morning as the weekly audit, half an hour after it.
    - cron: "47 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    name: "Unit tests (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    container:
      # Debian with Node, git and curl already present; uv brings its own Python.
      image: node:22-bookworm
    strategy:
      fail-fast: false
      matrix:
        # Every supported Python but the newest, which `ci.yml` runs on every push.
        python-version: ["3.12", "3.13"]

    # Only what depends on the interpreter: the lint, the audit and the catalogue checks
    # read the same on every Python and stay in `ci.yml`.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
        timeout-minutes: 5

      - name: Test
        # WeasyPrint's libraries, uv, `uv sync --locked` on this Python, the catalogues
        # compiled (the .mo files are not committed), the tests.
        uses: https://source.tiagoagueda.com/Postulo/plugin-ci@v1
        with:
          python-version: ${{ matrix.python-version }}
          lint: "false"
          catalogues: "false"
        timeout-minutes: 30
