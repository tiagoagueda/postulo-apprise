# The tests on the Pythons a push does not test (#13).
#
# `ci.yml` runs them on the newest supported Python alone, on every push. A plugin is
# installed into whichever Python the instance runs, and `requires-python` promises 3.12 and
# 3.13 as well, so they run here instead: weekly, on every release branch, and whenever
# somebody starts it by hand before a tag. The core does the same (postulo/postulo#713).
#
# A workflow of its own rather than a matrix in `ci.yml`, for the reasons the core's
# `every-python.yml` gives: this Forgejo expands a matrix before it knows the event.
name: Every Python

on:
  push:
    # Release branches only; `main` is `ci.yml`'s alone.
    branches: ["[0-9]*"]
  schedule:
    # The same morning as `ci.yml`'s weekly run, half an hour after it.
    - cron: "47 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Bump both together with `ci.yml`'s, which say why each is pinned, and with the core's.
env:
  UV_VERSION: "0.12.17"
  UV_INSTALLER_SHA256: "37b82230b28617c6c24fa52364fa28aa37f2aa40c114809a623f6b064a9730e5"

jobs:
  test:
    name: "Unit tests (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    container:
      # Debian with Node, git and curl already present; uv brings its own Python.
      image: node:22-bookworm
    strategy:
      fail-fast: false
      matrix:
        # Every supported Python but the newest, which `ci.yml` runs on every push.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install WeasyPrint's libraries
        # Postulo's settings import its PDF backend, which loads Pango.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libfontconfig1
          rm -rf /var/lib/apt/lists/*

      - name: Install uv
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" -o /tmp/uv-install.sh
          echo "${UV_INSTALLER_SHA256}  /tmp/uv-install.sh" | sha256sum -c -
          sh /tmp/uv-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install the plugin, Postulo and the test tools
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Compile the catalogues
        # The tests read the compiled catalogues (`.mo`), which are not committed; `ci.yml`
        # compiles them in its catalogue step, which this workflow does not run.
        run: uv run postulo-messages compile

      - name: Test
        run: uv run pytest
