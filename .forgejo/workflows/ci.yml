# Runs the plugin's tests inside a real Postulo, fetched from its repository by uv.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: python:3.14-slim-bookworm

    steps:
      - uses: actions/checkout@v4

      - name: Install git and WeasyPrint's libraries
        # git for the Postulo dependency; the libraries because Postulo's settings import
        # its PDF backend, which loads Pango.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libfontconfig1
          rm -rf /var/lib/apt/lists/*

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install the plugin, Postulo and the test tools
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Fail if the compiled catalogues are out of date
        # Postulo's own tool, from the core in the dev group. What stood here ran
        # `scripts/compile_messages.py`, a file this repository has never had, so the step
        # failed on every commit and the check it was meant to be never ran (#1).
        run: |
          uv run postulo-messages compile
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code -- '*.mo' || (echo "::error::A django.mo is stale. Run 'uv run postulo-messages compile' and commit." && exit 1)

      - name: Test
        # Including the surface check: a plugin that reaches past postulo.plugins.api is
        # a plugin that breaks on a patch release of the core.
        run: uv run pytest

  # A tag is a published version, and a published version promises more than a commit does:
  # the twenty-four European Union catalogues complete, and the core it was released beside
  # actually present rather than quietly missing (#1).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container:
      image: python:3.14-slim-bookworm

    steps:
      - uses: actions/checkout@v4

      - name: Install git and WeasyPrint's libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libfontconfig1
          rm -rf /var/lib/apt/lists/*

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install the plugin, Postulo and the test tools
        run: uv sync

      - name: The promises a published version makes
        run: uv run pytest -m release
