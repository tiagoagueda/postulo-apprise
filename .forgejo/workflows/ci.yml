# Runs the plugin's tests inside a real Postulo, fetched from its repository by uv.
#
# What runs is the shared plugin CI, Postulo/plugin-ci (postulo/postulo#1170): one action
# every plugin calls, holding the pinned uv, uv's cache, the lint, the catalogue checks, the
# tests and the dependency audit, so a change to the plugin CI is made once rather than in
# every repository. Its README lists the inputs. It is named by its full address because a
# bare name resolves against the instance's default actions host, not this one, and by its
# major tag, `v1`, which the plugin-ci repository moves forward with every compatible release.
#
# The job image is Node rather than Python, which looks backwards and is not: Forgejo runs
# `actions/checkout` as JavaScript *inside the job container*, so a container without
# `node` fails the checkout before a single step of this file runs — which is what every
# run here did, on `python:3.14-slim-bookworm` (#2). uv brings its own Python, so the image
# only has to carry Node, git and curl. Postulo's own CI is Node for the same reason and
# says so.
#
# `runs-on` must name a label the runner actually advertises. A label no runner has does
# not fail the job: it queues for ever, which looks exactly like CI passing.
#
# No `permissions:` block: this Forgejo does not support the field and warns that it is
# ignored. Every job here only reads the repository, which is what a job has without asking.
#
# Time limits sit on steps: the runner honours a step's `timeout-minutes` and ignores a
# job's. The numbers are generous; they are there to end a hang, not to time a run.
name: CI

on:
  # No `tags:` here: a tag is a commit `main` already tested, and `release.yml` is the one
  # workflow a tag starts (postulo/postulo#1170, PC6). No `schedule:` either: the weekly
  # look at the advisories is `weekly.yml`, which runs the audit alone. The schedule used to
  # be here, with `if: github.event_name != 'schedule'` on the test job, and this Forgejo
  # fails a job whose `if` is false instead of skipping it, so the weekly run failed the
  # test job it meant to leave out.
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      # Debian with Node, git and curl already present.
      image: node:22-bookworm

    steps:
      - uses: actions/checkout@v4
        with:
          # The token is not needed after the checkout; leaving it in .git/config would
          # hand it to every later step.
          persist-credentials: false
          # The whole history: the translation guard reads every commit it is given.
          fetch-depth: 0
        timeout-minutes: 5

      - name: Install, lint, check the catalogues and test
        # WeasyPrint's libraries, uv (the version the core names, its installer checked by
        # sha256, postulo/postulo#233, #790), `uv sync --locked --python 3.14`, ruff, the
        # catalogue checks and guard, Weblate's gate on its own pull request, the tests,
        # the surface check among them: a plugin that reaches past postulo.plugins.api is
        # a plugin that breaks on a patch release of the core.
        uses: https://source.tiagoagueda.com/Postulo/plugin-ci@v1
        timeout-minutes: 30

  # The id and the name stay `security` and "Security audit": they are the status check's
  # name, which a branch protection rule may require.
  security:
    name: Security audit
    # The locked dependencies against the advisory databases, on every push and, through
    # `weekly.yml`, every week. What an instance receives is resolved at install time under
    # the core's constraints, so the use of this audit is to say when the floor in
    # `dependencies` has to rise, or the core pin has to move, before a release goes out on a
    # tree with a known advisory. The lock rather than the installed environment, without
    # Postulo itself, a git dependency of the dev group that is not on PyPI.
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
        timeout-minutes: 5

      - name: Audit the locked Python dependencies
        uses: https://source.tiagoagueda.com/Postulo/plugin-ci@v1
        with:
          mode: audit
        timeout-minutes: 15
