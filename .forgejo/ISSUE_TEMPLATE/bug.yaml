name: Bug report
about: A notification does not arrive, or this plugin does not work for you.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time. Write in whatever language you can; English is easiest for the maintainer to act on, but a report in another language is better than none.

        **Is it a security problem?** Do not post it here, this page is public. Follow the core's [SECURITY.md](https://source.tiagoagueda.com/postulo/postulo/src/branch/main/SECURITY.md).

        **Remove personal details before you paste anything.** Postulo holds CVs, home addresses and the names of the people somebody is applying to. A log or a screenshot is where those leak: blank out names, addresses, e-mail addresses, company and listing details, tokens and cookies first.

        **An Apprise address is a credential.** `tgram://123:AAF.../`, `ntfy://user:password@...` and the rest carry the token or password of the service. Never paste one, here or in the logs: say which kind of service it is below, and leave the address out.
  - type: input
    id: version
    attributes:
      label: This plugin's version
      description: Settings → Plugins shows it.
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: postulo-version
    attributes:
      label: The Postulo version it runs beside
      description: The foot of every page shows it. On the `:dev` image, give the pinned tag (`<version>-dev.<short sha>`), because `:dev` moves.
      placeholder: "0.5.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How the plugin was installed
      options:
        - From the catalogue
        - From a wheel
        - Built into the image
        - Other (say so below)
    validations:
      required: true
  - type: input
    id: service
    attributes:
      label: The Apprise service the notification goes to
      description: The kind, not the address.
      placeholder: ntfy, Matrix, Telegram, mail
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you did, step by step
      placeholder: |
        1. Open ...
        2. Press ...
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Anything from the logs that bears on it, with personal details removed first, and with any Apprise address taken out.
      render: text
